events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip сжатие трафика для оптимизации производительности
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    upstream django_app {
        server web:8000;
    }

    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # Раздача статических файлов Django напрямую через Nginx
        location /static/ {
            alias /var/html/static/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Проксирование запросов к WSGI-серверу Gunicorn
        location / {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Эндпоинт мониторинга доступности
        location /api/health/ {
            proxy_pass http://django_app/api/health/;
            proxy_set_header Host $host;
            access_log off;
        }
    }
}
